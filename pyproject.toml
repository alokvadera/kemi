[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kemi"
version = "0.3.0"
description = "Persistent memory for AI agents. Three methods. Zero infra."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Vadera Alok", email = "alokvadera123@gmail.com"},
]
keywords = [
    "memory",
    "ai-agent",
    "persistent-memory",
    "llm",
    "rag",
    "vector-search",
    "mcp",
    "semantic-search",
    "embeddings",
    "agent-framework",
    "langchain",
    "chatgpt",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
]
long_description_content_type = "text/markdown"
dependencies = []

[project.optional-dependencies]
local = ["fastembed>=0.2.0"]
openai = ["openai>=1.0.0"]
mcp = ["mcp>=1.0.0"]
vec = ["sqlite-vec>=0.1.0"]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
redis = ["redis>=5.0"]
qdrant = ["qdrant-client>=1.9.0"]
chroma = ["chromadb>=0.4.0"]
langchain = ["langchain>=0.1.0"]
spacy = ["spacy>=3.7.0"]
encryption = ["cryptography>=41.0.0"]
sqlcipher = ["sqlcipher3>=0.5.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "matplotlib>=3.7.0",
]
all = [
    "fastembed>=0.2.0",
    "openai>=1.0.0",
    "mcp>=1.0.0",
    "sqlite-vec>=0.1.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5.0",
    "qdrant-client>=1.9.0",
    "chromadb>=0.4.0",
    "langchain>=0.1.0",
    "spacy>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/alokvadera/kemi"
Documentation = "https://github.com/alokvadera/kemi/tree/main/docs"
Repository = "https://github.com/alokvadera/kemi"
Issues = "https://github.com/alokvadera/kemi/issues"
Changelog = "https://github.com/alokvadera/kemi/blob/main/CHANGELOG.md"

[project.scripts]
kemi = "kemi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kemi"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disable_error_code = ["no-untyped-def"]

# Strict mode is only for production code
[[tool.mypy.overrides]]
module = ["kemi.*"]
enable_error_code = ["no-untyped-def"]
strict = true

# Optional dependency packages — no type stubs available
[[tool.mypy.overrides]]
module = ["openai"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fastembed"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.cluster"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.rows", "psycopg.types.json", "psycopg_pool"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redis"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["qdrant_client", "qdrant_client.http.models"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.api.types"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["no-untyped-def"]
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=kemi --cov-report=term-missing --cov-fail-under=80"

# Coverage configuration
# ----------------------
# Adapters for optional backends (chroma, qdrant, redis, postgres, openai,
# fastembed) are excluded from coverage because their tests can only run
# when the corresponding dependency is installed. Run `pip install
# kemi[all]` and remove the omit list below to get a complete coverage
# report.
[tool.coverage.run]
omit = [
    "src/kemi/adapters/embedding/fastembed.py",
    "src/kemi/adapters/embedding/openai.py",
    "src/kemi/adapters/storage/custom.py",
    "src/kemi/adapters/storage/postgres.py",
    "src/kemi/adapters/storage/redis.py",
    "src/kemi/adapters/storage/qdrant.py",
    "src/kemi/adapters/storage/chroma.py",
    "src/kemi/adapters/base.py",
    "src/kemi/mcp_server.py",
    "src/kemi/integrations/langchain.py",
    "src/kemi/cli.py",
]

[tool.coverage.report]
# When running with the default install, `pip install kemi`, the omitted
# files (above) are still excluded — but every other module IS measured.
# This means the `92%` badge reflects the *core path* (SQLite + fastembed),
# not a global percentage. Install all extras to get full coverage.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.0.0",
    "matplotlib>=3.7.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "scikit-learn>=1.3.0",
    "cryptography>=41.0.0",
]
