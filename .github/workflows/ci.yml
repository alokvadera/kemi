name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/kemi/ tests/
      - run: uv run pytest --ignore=tests/test_api_integration.py --cov=kemi --cov-report=term-missing --cov-fail-under=80

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run pytest tests/test_api_integration.py -v

  benchmark-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra vec
      - run: uv run python scripts/benchmark_recall_models.py

  benchmark-entity-graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run python scripts/benchmark_entity_boost.py
      - run: uv run python scripts/benchmark_entity_latency.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-entity-graphs
          path: |
            scripts/benchmark_entity_boost_results.png
            scripts/benchmark_entity_latency_results.png
